<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>师傅维修端</title><link rel="stylesheet" href="/repair-assets/style.css?v=20261019-login-beauty"><link rel="stylesheet" href="/repair-assets/technician.css?v=20261019-login-beauty"></head><body class="login-view"><div class="techShell"><header><div><b>手机维修 · 师傅端</b><small>扫码查看自己的维修项目</small></div><button id="logout" class="secondary" hidden>退出</button></header><main><div id="notice" role="status"></div><section id="loginPanel" class="card"><div class="loginBrand"><span class="loginMark" aria-hidden="true">修</span><p>手机维修合作承揽</p></div><p class="loginIntro">专注手中的维修，工价记录一目了然。</p><h2 id="loginTitle">师傅登录</h2><form id="authForm" method="post" action="javascript:void(0)" autocomplete="on" onsubmit="return false"><label>用户名<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" minlength="5" required autocomplete="current-password"></label><button id="authSubmit" type="submit" class="wide">登录</button></form><button class="secondary wide" id="modeSwitch">没有账号？注册师傅</button><p class="muted">注册后需要管理员审核。</p><a class="loginBack" href="/">返回身份选择</a></section><div id="app" hidden><section class="card"><h2>我的维修</h2><div class="searchLine"><input id="query" aria-label="查询串码或型号" placeholder="输入完整串码、后六位或型号"><button id="search">查询</button></div><button id="scan" class="secondary wide">打开摄像头扫码</button><div id="cameraBox" class="cameraBox" hidden><div class="scanStage"><video id="camera" autoplay playsinline muted></video><div class="scanFrame" aria-hidden="true"><span></span><i></i></div></div><p class="scanGuide">请将条形码放入框内，保持手机稳定</p><button id="stopScan" class="secondary wide">关闭摄像头</button></div></section><section class="stats"><div class="card"><small>今日净工价</small><b id="todayWage">¥0.00</b><span id="todayCount">0 项</span></div><div class="card"><small>本月净工价</small><b id="monthWage">¥0.00</b><span id="monthCount">0 项</span></div><div class="card"><small>累计净工价</small><b id="totalWage">¥0.00</b><span id="totalCount">0 项</span></div></section><section class="card"><h2>分配给我的订单</h2><div id="orders"></div></section><section class="card" id="detail" hidden></section></div></main></div><script src="/repair-assets/zxing-browser.min.js?v=20261019-camera"></script><script src="/repair-assets/session.js?v=20261019-session"></script><script src="/repair-assets/technician.js?v=20261019-scanfix9"></script></body></html>
